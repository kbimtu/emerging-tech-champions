name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Upgraded to @v4 (Node 24 native)
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Bun environment natively
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Clean setup and application packaging
      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      # Upgraded to @v5 (Node 24 native)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upgraded to @v3 (Node 24 native)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Upgraded to @v4 (Node 24 native)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
